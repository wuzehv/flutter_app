<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="jenkins_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>jenkins_app</title>
  <link rel="manifest" href="manifest.json">
  <script>
    (function() {
      var proxy = new Proxy({}, {
        set: function(target, prop, value) {
          if (prop === 'loader' && value && value.load) {
            var orig = value.load.bind(value);
            value.load = function(opts) {
              opts = opts || {};
              opts.config = opts.config || {};
              if (!opts.config.canvasKitBaseUrl) {
                opts.config.canvasKitBaseUrl = 'canvaskit/';
              }
              return orig(opts);
            };
          }
          target[prop] = value;
          return true;
        }
      });
      Object.defineProperty(window, '_flutter', {
        configurable: true,
        get: function() { return proxy; },
        set: function(v) {
          Object.keys(v).forEach(function(k) { proxy[k] = v[k]; });
        }
      });
    })();
  </script>
  <script>
    {{flutter_bootstrap_js}}
  </script>
</body>
</html>
