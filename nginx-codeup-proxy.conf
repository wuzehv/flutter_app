# ========== Flutter Web 静态页面服务 ==========
server {
    listen 10003;
    server_name _;

    # Flutter 编译产物路径（build/web/），部署时替换为实际目录
    root /var/www/jenkins_web;
    index index.html;

    # gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # 缓存静态资源（Flutter 生成的 JS/CSS/图片等带 hash）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Flutter 单页应用（SPA）：所有路由都返回 index.html，由前端路由处理
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ========== CodeUp API 反向代理 ==========
server {
    listen 10002;
    server_name _;

    # nginx 默认会忽略带下划线的 header，必须开启才能透传 x-yunxiao-token
    underscores_in_headers on;

    # 日志（可选）
    access_log /var/log/nginx/codeup-access.log;
    error_log /var/log/nginx/codeup-error.log;

    # CORS 预检请求处理
    location / {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '$http_origin' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,x-yunxiao-token' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Max-Age' 1728000 always;
            add_header 'Content-Type' 'text/plain; charset=utf-8' always;
            add_header 'Content-Length' 0 always;
            return 204;
        }

        # 反向代理到阿里云 CodeUp API
        proxy_pass https://openapi-rdc.aliyuncs.com;

        # SSL 相关（上游为 HTTPS）
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;

        # 超时设置
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 30s;

        # 透传真实请求头
        proxy_set_header Host openapi-rdc.aliyuncs.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 确保自定义头透传（如 x-yunxiao-token）
        proxy_pass_request_headers on;
        proxy_set_header x-yunxiao-token $http_x_yunxiao_token;

        # CORS 响应头（对实际请求）
        add_header 'Access-Control-Allow-Origin' '$http_origin' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,x-yunxiao-token' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
    }
}
